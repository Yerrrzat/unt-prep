name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unt
          POSTGRES_PASSWORD: unt
          POSTGRES_DB: unt_prep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unt -d unt_prep"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgresql://unt:unt@localhost:5432/unt_prep?schema=public
        run: npx prisma migrate deploy

      - name: Check schema.prisma matches the migrations
        env:
          DATABASE_URL: postgresql://unt:unt@localhost:5432/unt_prep?schema=public
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      # No env on purpose: the build must not depend on a database or secrets.
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          tags: unt-prep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
